# nagents configuration
# Changes are hot-reloaded (no restart needed).

# HTTP port for hook pushes (POST /event) and state queries (GET /state)
http_port: 3335

# Log level: trace, debug, info, warn, error
log_level: info

# ─── Sources ─────────────────────────────────────────────────────────────────
# Each source is a scanner command (any language) that outputs JSON to stdout.
# Hooks push events via HTTP POST /event.

sources:
  kiro-ide:
    scanner: "python3 sources/kiro-ide/scan.py"
    interval_sec: 60
    hook: true
    enabled: true
  kiro-crew:
    scanner: "python3 sources/kiro-crew/scan.py"
    interval_sec: 60
    hook: false
    enabled: true
  kiro-cli-v2:
    scanner: "python3 sources/kiro-cli-v2/scan.py"
    interval_sec: 5
    hook: true
    enabled: true
  kiro-cli-v3:
    scanner: "python3 sources/kiro-cli-v3/scan.py"
    interval_sec: 5
    hook: true
    enabled: true

# ─── Attention Rules ─────────────────────────────────────────────────────────
# Core rules applied when source doesn't explicitly set attention.
# Source can always override by setting attention_source: true/false.

attention_rules:
  idle_threshold_sec: 30       # active session, no activity for 30s
  tool_stuck_sec: 30           # tool event older than 30s → "approval"
  running_stuck_sec: 120       # running event older than 120s → "stuck"
  waiting_statuses:            # statuses that always trigger attention
    - waiting_on_user
    - waiting_for_approval

# ─── Panel Order ─────────────────────────────────────────────────────────────
# Order of groups in the panel. "on-screen" = sessions currently on overlay.
# IDE sessions are further sub-grouped by workspace.

panel_order:
  - kiro-cli-v2
  - kiro-cli-v3
  - kiro-crew
  - kiro-ide

# ─── Overlay Physics ─────────────────────────────────────────────────────────
# Speed and behavior controls for overlay characters.

overlay:
  follow_strength: 0.04        # How strongly chars follow cursor (0.01-0.1)
  roam_strength: 0.008         # How strongly chars move to roam targets
  roam_max_speed: 3            # Max roam speed (pixels/frame)
  follow_max_speed: 6          # Max follow speed (pixels/frame)
  min_cursor_distance: 80      # Min distance from cursor (follow mode)
  collision_distance: 100       # Min distance between chars (pixels, accounts for labels)
  revolve_radius: 40           # Dot orbit radius (larger = more space between dots and followers)
  revolve_speed: 0.015         # Dot orbit speed (radians/frame)
  shrink_after_min: 5           # Minutes before non-attention roamers shrink to dot (0=disabled)
  dot_scale: 0.5               # How much to scale down dot chars (0.3-0.7)
  cursor_fps: 10              # Cursor poll rate (higher=smoother follow, costs one HTTP call per tick)
  cursor_smoothing: 0.12      # Lerp factor (tuned for 10fps cursor: 0.12 at 60fps ≈ 7 frames to target)
  physics_fps: 60              # Physics/render loop (pure JS math, keep smooth)
  font_size_group: 9           # Group label font size (px)
  font_size_title: 10          # Session title font size (px)
  font_size_action: 10         # Action line font size (px)
  # Zone system
  max_followers: 2             # Max chars following cursor
  max_roamers: 3              # Max free-roaming chars
  max_dots: 5                  # Max dots orbiting cursor
  pin_counts_toward_max: false # If true, pinned chars consume max_followers slots
  group_as_one: false          # Merge same-group sessions into one visual unit
  # group_display: cluster (all visible, close), single (one rep), carousel (rotate)
  group_display: cluster
  # Panel display mode: compact (32px chars, tight) or comfortable (48px, spacious)
  panel_mode: compact
  # Follower ordering (based on last_user_ts, not agent mtime)
  # Options: fifo, lifo, lru, priority, round_robin (comma-separated chain)
  follower_mode: "lifo"
  round_robin_sec: 10          # Rotation interval for round_robin mode
# Map source → default character ID for new sessions from that source.
# ─── Characters ──────────────────────────────────────────────────────────────
# Default char per source (flat). Pool assignment done in frontend.
# Per-session override via right-click in panel (persisted to localStorage).

characters:
  kiro-crew: ghost
  kiro-cli-v2: cat
  kiro-cli-v3: cat
  kiro-ide: ghost
