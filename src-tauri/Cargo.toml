[package]
name = "nagents"
version = "0.1.0"
edition = "2021"

[lib]
name = "nagents"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiny_http = "0.12"
notify = "6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[build-dependencies]
tauri-build = { version = "2", features = [] }
