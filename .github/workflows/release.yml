name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'nagents ${{ github.ref_name }}'
          releaseBody: 'Desktop companion for AI agent sessions.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # Portable zip (no installer)
      - name: Create portable zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          zip -r nagents-${{ github.ref_name }}-${{ matrix.target }}.zip nagents.app

      - name: Create portable zip (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/nagents.exe" -DestinationPath "nagents-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload portable zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nagents-*.zip
          draft: false
