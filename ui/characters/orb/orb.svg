<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ghost-body">
  <!-- Outer ring -->
  <circle class="ring outer-ring" cx="32" cy="32" r="18" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner sphere -->
  <circle class="body sphere" cx="32" cy="32" r="12" fill="#1e3a5f" fill-opacity="0.8" stroke="#60a5fa" stroke-width="1"/>
  <!-- Core light -->
  <circle class="core" cx="32" cy="32" r="5" fill="#93c5fd" fill-opacity="0.9"/>
  <!-- Highlight -->
  <circle class="highlight" cx="28" cy="28" r="3" fill="white" opacity="0.3"/>
  <!-- Scanning arc (rotates) -->
  <path class="scan-arc" d="M32 14 A18 18 0 0 1 50 32" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
