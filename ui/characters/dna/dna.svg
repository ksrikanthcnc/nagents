<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ghost-body">
  <!-- Double helix body shape -->
  <path class="body" d="M22 10 Q38 18 22 26 Q38 34 22 42 Q38 50 22 58"
    fill="none" stroke="#E040FB" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M42 10 Q26 18 42 26 Q26 34 42 42 Q26 50 42 58"
    fill="none" stroke="#7C4DFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- Rungs -->
  <line x1="26" y1="18" x2="38" y2="18" stroke="#CE93D8" stroke-width="1.5" opacity="0.5"/>
  <line x1="26" y1="34" x2="38" y2="34" stroke="#CE93D8" stroke-width="1.5" opacity="0.5"/>
  <line x1="26" y1="50" x2="38" y2="50" stroke="#CE93D8" stroke-width="1.5" opacity="0.5"/>
  <!-- Eyes on middle rung area -->
  <circle class="eye" cx="29" cy="32" r="2.5" fill="#4A148C"/>
  <circle class="eye" cx="37" cy="32" r="2.5" fill="#4A148C"/>
</svg>
