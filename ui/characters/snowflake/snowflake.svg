<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ghost-body">
  <!-- Snowflake body — six spokes -->
  <g class="body" fill="none" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="58"/>
    <line x1="9.5" y1="19" x2="54.5" y2="45"/>
    <line x1="9.5" y1="45" x2="54.5" y2="19"/>
  </g>
  <!-- Branch tips -->
  <g fill="none" stroke="#BBDEFB" stroke-width="1.5" stroke-linecap="round">
    <line x1="32" y1="14" x2="26" y2="18"/><line x1="32" y1="14" x2="38" y2="18"/>
    <line x1="32" y1="50" x2="26" y2="46"/><line x1="32" y1="50" x2="38" y2="46"/>
  </g>
  <!-- Center crystal -->
  <circle class="center" cx="32" cy="32" r="8" fill="#E3F2FD" fill-opacity="0.6" stroke="#90CAF9" stroke-width="0.8"/>
  <!-- Eyes -->
  <circle class="eye eye-left" cx="28" cy="31" r="2" fill="#1565C0"/>
  <circle class="eye eye-right" cx="36" cy="31" r="2" fill="#1565C0"/>
  <path class="mouth" d="M29 35 Q32 38 35 35" fill="none" stroke="#1565C0" stroke-width="1" stroke-linecap="round"/>
</svg>
