<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ghost-body">
  <!-- Electron orbits -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#42A5F5" stroke-width="1" opacity="0.5"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#42A5F5" stroke-width="1" opacity="0.5" transform="rotate(60 32 32)"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#42A5F5" stroke-width="1" opacity="0.5" transform="rotate(120 32 32)"/>
  <!-- Nucleus body -->
  <circle class="body" cx="32" cy="32" r="10" fill="#42A5F5" fill-opacity="0.85" stroke="#1E88E5" stroke-width="1"/>
  <!-- Electrons -->
  <circle cx="58" cy="32" r="2.5" fill="#90CAF9" opacity="0.8"/>
  <circle cx="19" cy="14" r="2.5" fill="#90CAF9" opacity="0.8"/>
  <circle cx="19" cy="50" r="2.5" fill="#90CAF9" opacity="0.8"/>
  <!-- Eyes -->
  <circle class="eye" cx="29" cy="31" r="2" fill="#0D47A1"/>
  <circle class="eye" cx="35" cy="31" r="2" fill="#0D47A1"/>
</svg>
