<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ghost-body">
  <!-- Planet body -->
  <circle class="body" cx="32" cy="32" r="18" fill="#5C6BC0" fill-opacity="0.85" stroke="#3949AB" stroke-width="1"/>
  <!-- Ring -->
  <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="#9FA8DA" stroke-width="1.5" opacity="0.6" transform="rotate(-20 32 32)"/>
  <!-- Surface band -->
