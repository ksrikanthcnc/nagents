<svg viewBox="0 0 56 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <polygon points="12,20 8,4 20,16" fill="#4a4a5a" stroke="#3a3a4a" stroke-width="1"/>
  <polygon points="44,20 48,4 36,16" fill="#4a4a5a" stroke="#3a3a4a" stroke-width="1"/>
  <!-- Inner ears -->
  <polygon points="13,18 10,8 19,16" fill="#ff9eb5" opacity="0.6"/>
  <polygon points="43,18 46,8 37,16" fill="#ff9eb5" opacity="0.6"/>
  <!-- Head -->
  <ellipse cx="28" cy="30" rx="18" ry="16" fill="#4a4a5a" stroke="#3a3a4a" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="28" cy="50" rx="14" ry="12" fill="#4a4a5a" stroke="#3a3a4a" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="21" cy="28" rx="4" ry="4.5" fill="#a8e6cf" class="eye eye-left"/>
  <ellipse cx="35" cy="28" rx="4" ry="4.5" fill="#a8e6cf" class="eye eye-right"/>
  <!-- Pupils -->
  <ellipse cx="21" cy="28" rx="2" ry="3" fill="#1a1a2a"/>
  <ellipse cx="35" cy="28" rx="2" ry="3" fill="#1a1a2a"/>
  <!-- Nose -->
  <ellipse cx="28" cy="34" rx="2" ry="1.5" fill="#ff9eb5"/>
  <!-- Whiskers -->
  <line x1="6" y1="32" x2="18" y2="33" stroke="#6a6a7a" stroke-width="0.8"/>
  <line x1="6" y1="36" x2="18" y2="35" stroke="#6a6a7a" stroke-width="0.8"/>
  <line x1="38" y1="33" x2="50" y2="32" stroke="#6a6a7a" stroke-width="0.8"/>
  <line x1="38" y1="35" x2="50" y2="36" stroke="#6a6a7a" stroke-width="0.8"/>
  <!-- Tail -->
  <path d="M42 50 C50 45 54 55 48 58" fill="none" stroke="#4a4a5a" stroke-width="3" stroke-linecap="round"/>
</svg>
