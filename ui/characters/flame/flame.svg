  <!-- Eyes (ember dots) -->
  <circle class="ember ember-left" cx="28" cy="40" r="2.5" fill="#1a1a1a" opacity="0.7"/>
  <circle class="ember ember-right" cx="36" cy="40" r="2.5" fill="#1a1a1a" opacity="0.7"/>
  <!-- Sparkles -->
  <circle class="spark spark-1" cx="22" cy="20" r="1" fill="#FFDD44" opacity="0.6"/>
  <circle class="spark spark-2" cx="40" cy="16" r="1.2" fill="#FFAA00" opacity="0.5"/>
  <circle class="spark spark-3" cx="26" cy="10" r="0.8" fill="#FF6B00" opacity="0.4"/>
</svg>
