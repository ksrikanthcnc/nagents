<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ghost-body">
  <!-- Alien head/body (tall oval) -->
  <ellipse class="body" cx="32" cy="34" rx="16" ry="20" fill="#69F0AE" fill-opacity="0.85" stroke="#00C853" stroke-width="1"/>
  <!-- Antennae -->
  <line x1="24" y1="16" x2="20" y2="8" stroke="#00C853" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="7" r="2" fill="#B9F6CA"/>
  <line x1="40" y1="16" x2="44" y2="8" stroke="#00C853" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="44" cy="7" r="2" fill="#B9F6CA"/>
  <!-- Big alien eyes -->
  <ellipse class="eye" cx="26" cy="32" rx="4" ry="5" fill="#004D40"/>
  <ellipse class="eye" cx="38" cy="32" rx="4" ry="5" fill="#004D40"/>
  <!-- Eye shine -->
  <circle cx="27" cy="30" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="39" cy="30" r="1.5" fill="white" opacity="0.4"/>
</svg>
